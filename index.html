<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Map components, dependencies, and execution flow without running your codebase." />
    <link rel="icon" href="/component-atlas-logo.png" />
    <title>Component Atlas — Understand codebases</title>
    <script>
      try {
        var theme = localStorage.getItem("component-atlas-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.appTheme = theme;
          document.body.dataset.appTheme = theme;
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
